<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your MediCare+ account and start accessing quality healthcare services." />
  <title>Register | MediCare+</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-page">
    <!-- Header -->
    <div class="auth-header">
      <a href="index.html" class="auth-back">
        <i class="ri-arrow-left-line"></i>
      </a>
      <h1>Create Account</h1>
      <p>Join MediCare+ for better healthcare</p>
    </div>

    <!-- Form -->
    <div class="auth-body">
      <form id="register-form">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" class="form-control" placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number" />
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" class="form-control" />
        </div>

        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" class="form-control">
            <option value="" disabled selected>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Create a password" />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password" />
        </div>

        <div class="checkbox-group" style="margin-bottom: 24px;">
          <input type="checkbox" id="terms" />
          <label for="terms">I agree to the <a href="#" class="forgot-link">Terms & Conditions</a></label>
        </div>

        <a href="dashboard.html" class="btn btn-primary">Create Account</a>
      </form>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

</body>
</html>
